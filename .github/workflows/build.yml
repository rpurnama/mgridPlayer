name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-22.04   # older glibc => bundle runs on more distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install VLC and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y vlc libvlc-dev ffmpeg xvfb libxcb-cursor0 libegl1 libxkbcommon-x11-0
      - name: Tests
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          QT_QPA_PLATFORM=offscreen .venv/bin/python -m pytest -q
      - name: Build
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          APPIMAGETOOL="$PWD/appimagetool --appimage-extract-and-run" packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mgridPlayer-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install VLC
        run: choco install vlc -y --no-progress
      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1 -VlcDir "C:\Program Files\VideoLAN\VLC"
      - uses: actions/upload-artifact@v4
        with:
          name: mgridPlayer-windows
          path: dist/*.zip

  release:
    # On a version tag (v1.0.0, ...), publish both builds as a public GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
